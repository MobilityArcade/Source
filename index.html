let audioCtx, baseOsc, baseGain, shimmerOsc, shimmerGain, humOsc, humGain, beatOsc, beatGain, resonanceOsc, resonanceGain;
let beatTimer = 0;

function initAudio(){
  if(audioCtx) {
    if(audioCtx.state !== "running") audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  baseOsc = audioCtx.createOscillator();
  baseGain = audioCtx.createGain();
  baseOsc.type = "sine";
  baseOsc.frequency.value = 34;
  baseGain.gain.value = 0.08;
  baseOsc.connect(baseGain).connect(audioCtx.destination);
  baseOsc.start();

  shimmerOsc = audioCtx.createOscillator();
  shimmerGain = audioCtx.createGain();
  shimmerOsc.type = "sine";
  shimmerOsc.frequency.value = 144;
  shimmerGain.gain.value = 0.03;
  shimmerOsc.connect(shimmerGain).connect(audioCtx.destination);
  shimmerOsc.start();

  humOsc = audioCtx.createOscillator();
  humGain = audioCtx.createGain();
  humOsc.type = "sine";
  humOsc.frequency.value = 52;
  humGain.gain.value = 0.025;
  humOsc.connect(humGain).connect(audioCtx.destination);
  humOsc.start();

  beatOsc = audioCtx.createOscillator();
  beatGain = audioCtx.createGain();
  beatOsc.type = "sine";
  beatOsc.frequency.value = 82;
  beatGain.gain.value = 0.0001;
  beatOsc.connect(beatGain).connect(audioCtx.destination);
  beatOsc.start();

  resonanceOsc = audioCtx.createOscillator();
  resonanceGain = audioCtx.createGain();
  resonanceOsc.type = "sine";
  resonanceOsc.frequency.value = 220;
  resonanceGain.gain.value = 0.0001;
  resonanceOsc.connect(resonanceGain).connect(audioCtx.destination);
  resonanceOsc.start();
}

function heartbeat(intensity){
  if(!audioCtx || !beatGain) return;

  const now = audioCtx.currentTime;

  beatOsc.type = "sine";

  beatOsc.frequency.setValueAtTime(
    120 + intensity * 60,
    now
  );

  beatGain.gain.cancelScheduledValues(now);

  beatGain.gain.setValueAtTime(0.0001, now);

  beatGain.gain.linearRampToValueAtTime(
    0.025 + intensity * 0.04,
    now + 0.12
  );

  beatGain.gain.exponentialRampToValueAtTime(
    0.0001,
    now + 0.75
  );
}


let musicVolume = 0.35;
let themeTimer = 0;
const sourceNotes = [261.63,293.66,329.63,392.00,440.00];

  function vibrate(pattern){
  if(navigator.vibrate){
    navigator.vibrate(pattern);
  }
}
function playTone(freq,dur=0.25,vol=0.05,type="triangle"){
  if(!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = type;
  osc.frequency.value = freq;
  gain.gain.value = 0.0001;
  osc.connect(gain).connect(audioCtx.destination);
  const now = audioCtx.currentTime;
  gain.gain.setValueAtTime(0.0001, now);
  gain.gain.linearRampToValueAtTime(vol*musicVolume, now+0.02);
  gain.gain.exponentialRampToValueAtTime(0.0001, now+dur);
  osc.start(now);
  osc.stop(now+dur+0.05);
}

function playSourceTheme(){
  if(!audioCtx) return;

  const events = [
    {freq:110, dur:2.4, vol:0.025, type:"sine", delay:0},
    {freq:220, dur:0.35, vol:0.020, type:"sine", delay:3200},
    {freq:165, dur:1.8, vol:0.018, type:"sine", delay:6200},
    {freq:330, dur:0.25, vol:0.015, type:"sine", delay:9000},
    {freq:130, dur:2.8, vol:0.022, type:"sine", delay:12500}
  ];

  events.forEach(e=>{
    setTimeout(()=>{
      playTone(
        e.freq,
        e.dur,
        e.vol,
        e.type
      );
    }, e.delay);
  });
}

function playCollectionChime(tier){

function discoverySound(){
  if(!audioCtx || !resonanceGain) return;
  const now = audioCtx.currentTime;
  resonanceOsc.frequency.cancelScheduledValues(now);
  resonanceGain.gain.cancelScheduledValues(now);
  resonanceOsc.frequency.setValueAtTime(120, now);
  resonanceOsc.frequency.exponentialRampToValueAtTime(620, now + 0.75);
  resonanceGain.gain.setValueAtTime(0.0001, now);
  resonanceGain.gain.exponentialRampToValueAtTime(0.25, now + 0.06);
  resonanceGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
}

function forwardVector(){
  return new THREE.Vector3(
    Math.sin(yaw)*Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw)*Math.cos(pitch)
  ).normalize();
}

function updateCamera(){
  if(FREEFALL_MODE){
    camera.lookAt(
      camera.position.clone().add(
        new THREE.Vector3(0,0,-1)
      )
    );
    return;
  }

  const f = forwardVector();
  camera.lookAt(camera.position.clone().add(f));
}

function disposeObject(obj){
  if(!obj) return;

  obj.traverse(child=>{
    if(child.geometry){
      child.geometry.dispose();
    }

    if(child.material){
      if(Array.isArray(child.material)){
        child.material.forEach(m=>{
          if(m.dispose) m.dispose();
        });
      } else {
        if(child.material.dispose){
          child.material.dispose();
        }
      }
    }
  });
}
  
function randomPointInSphere(radius){
  const u = Math.random();
  const v = Math.random();
  const theta = u * Math.PI * 2;
  const phi = Math.acos(2*v - 1);
  const r = radius * Math.cbrt(Math.random());
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
}

function randomPointInFreefallField(){
  const angle = Math.random() * Math.PI * 2;
  const radius = Math.sqrt(Math.random()) * (FREEFALL_RADIUS * 0.75);

  return new THREE.Vector3(
    Math.cos(angle) * radius,
    Math.sin(angle) * radius,
    FREEFALL_FAR_Z + Math.random() * FREEFALL_LENGTH
  );
}

function recycleFreefallBeacon(b){
  const p = randomPointInFreefallField();
  p.z = FREEFALL_FAR_Z - Math.random() * 420;

  b.position.copy(p);
  b.userData.state = "active";
  b.userData.fade = 1;

  if(b.userData.core){
    b.userData.core.material.transparent = false;
    b.userData.core.material.opacity = 1;
    b.userData.core.scale.setScalar(1);
  }

  if(b.userData.aura){
    b.userData.aura.material.opacity = 0.0;
  }

  const rr = b.userData.rings || [b.userData.ring];
  rr.forEach(r=>{
    if(r && r.material){
      r.material.opacity = 0.12;
      r.scale.setScalar(1);
    }
  });

  if(!b.parent) scene.add(b);
}

function applyFreefallDrift(dt){
  camera.position.x += driftVelocityX * dt;
  camera.position.y += driftVelocityY * dt;

  driftVelocityX *= Math.pow(FREEFALL_FRICTION, dt * 60);
  driftVelocityY *= Math.pow(FREEFALL_FRICTION, dt * 60);

  const edge = Math.hypot(camera.position.x, camera.position.y);
  if(edge > FREEFALL_RADIUS){
    const scale = FREEFALL_RADIUS / edge;
    camera.position.x *= scale;
    camera.position.y *= scale;
    driftVelocityX *= 0.35;
    driftVelocityY *= 0.35;
  }
}

function updateFreefallObjects(dt){
  beacons.forEach(b=>{
    if(b.userData.state === "collected") return;

    b.position.z += FREEFALL_SPEED * dt;

    if(b.position.z > FREEFALL_NEAR_Z){
      recycleFreefallBeacon(b);
    }
  });

  landmarks.forEach(l=>{
    l.position.z += FREEFALL_SPEED * dt * 0.55;
    if(l.position.z > 140){
      const p = randomPointInFreefallField();
      p.z = FREEFALL_FAR_Z - Math.random() * 700;
      l.position.copy(p);
    }
  });
}

function toRoman(num){

  const romans = [
    ["M",1000],
    ["CM",900],
    ["D",500],
    ["CD",400],
    ["C",100],
    ["XC",90],
    ["L",50],
    ["XL",40],
    ["X",10],
    ["IX",9],
    ["V",5],
    ["IV",4],
    ["I",1]
  ];

  let result = "";

  for(const [symbol,value] of romans){
    while(num >= value){
      result += symbol;
      num -= value;
    }
  }

  return result;
}
  
function currentWorld(){

  const worldIndex =
    (level - 1) % WORLDS.length;

  const cycle =
    Math.floor(
      (level - 1) / WORLDS.length
    );

  const world = {
    ...WORLDS[worldIndex]
  };

  world.baseName = world.name;
  world.cycle = cycle + 1;

  if(cycle < 10){

    const prefix =
      CYCLE_NAMES[
        Math.min(
          cycle,
          CYCLE_NAMES.length - 1
        )
      ];

    world.name =
      prefix + world.name;

  } else {

    world.name =
      world.name +
      " " +
      toRoman(cycle + 1);

  }

  return world;
}

function updateWorld(force=false){

  const worldIndex =
    (level - 1) % WORLDS.length;

  if(!force && worldIndex === currentWorldIndex) return;

  currentWorldIndex = worldIndex;

  const world = currentWorld();

  scene.fog.density = world.fog;
  baseFogDensity = world.fog;

  document.getElementById("world").textContent = world.name;

  makeOuterCosmos(world);

  if(level > 1 || force){
    const wf = document.getElementById("worldFlash");
    wf.innerHTML = world.name.toUpperCase();
    wf.style.display = "grid";
    setTimeout(()=>wf.style.display = "none", 1200);
  }
}

  disposeObject(innerParticles);
  scene.remove(innerParticles);
}

  const count = 800;

  const colors = new Float32Array(count * 3);
  const world = currentWorld();
  const palette = world.colors.map(c => new THREE.Color(c)).concat([
    new THREE.Color(0xffffff), new THREE.Color(0x777777)
  ]);

  for(let i=0;i<count;i++){

function createSkyPointCloud(world, count, radius, size, opacity){
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const palette = world.colors.map(c => new THREE.Color(c));

  for(let i=0;i<count;i++){
    const u = Math.random();
    const v = Math.random();
    const theta = u * Math.PI * 2;
    const phi = Math.acos(2*v - 1);
    const jitter = radius + (Math.random()*2-1)*120;

    positions[i*3] = jitter * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = jitter * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = jitter * Math.cos(phi);

    const c = palette[Math.floor(Math.random()*palette.length)].clone();
    c.multiplyScalar(0.42 + Math.random()*0.72);
    colors[i*3] = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors,3));

  const mat = new THREE.PointsMaterial({
    size, sizeAttenuation:true, transparent:true, opacity, vertexColors:true
  });

  return new THREE.Points(geo, mat);
}

function createShootingStar(){
  const world = currentWorld();
  const colors = world.colors || [0xffffff,0x8fffff,0xffd36a];
  const group = new THREE.Group();

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(3.5, 16, 16),
    new THREE.MeshBasicMaterial({
      color:colors[Math.floor(Math.random()*colors.length)],
      transparent:true, opacity:0.95,
      blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  group.add(head);

  const count = 70;
  const positions = new Float32Array(count*3);
  const cols = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    positions[i*3] = 0;
    positions[i*3+1] = 0;
    positions[i*3+2] = i * 3.2;
    const c = new THREE.Color(i%2 ? 0xffffff : colors[Math.floor(Math.random()*colors.length)]);
    c.multiplyScalar(1 - i/count*0.75);
    cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(cols,3));
  const mat = new THREE.PointsMaterial({
    size:2.4, sizeAttenuation:true, transparent:true, opacity:0.72,
    vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
  group.add(new THREE.Points(geo, mat));

  group.position.copy(randomPointInSphere(sphereRadius * 1.65));
  const dir = randomPointInSphere(1).normalize();
  group.userData.velocity = dir.multiplyScalar(180 + Math.random()*160);
  group.userData.life = 1.8 + Math.random()*1.2;
  group.userData.maxLife = group.userData.life;
  group.lookAt(group.position.clone().sub(group.userData.velocity));
  scene.add(group);
  meteors.push(group);
}

function maybeMeteorShower(dt){
  nextMeteorTime -= dt;
  if(nextMeteorTime <= 0){
    const burst = Math.random() < 0.22;
    const count = burst ? 5 + Math.floor(Math.random()*7) : 1;
    for(let i=0;i<count;i++) setTimeout(()=>createShootingStar(), i*120);
    nextMeteorTime = burst ? 18 + Math.random()*22 : 7 + Math.random()*12;
  }
}



function randomOuterPosition(minR=1450, maxR=2450){
  const u = Math.random();
  const v = Math.random();
  const theta = u * Math.PI * 2;
  const phi = Math.acos(2*v - 1);
  const r = minR + Math.random() * (maxR - minR);
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
}

function startWarpHold(){
  if(reverseWarpLock || reverseWarpHeld) return;

  initAudio();

  warpHeld = true;

  vibrate(20);

  warpSteeringActive = true;
  warpSteerLastX = holdStartX;
  warpSteerLastY = holdStartY;

  const c = document.getElementById("center");
  c.classList.add("warping");
  c.style.background = "#39ff14";
}
function stopWarpHold(){
  reverseWarpLock = false;
  warpHeld = false;
  reverseWarpHeld = false;
  warpSteeringActive = false;
  warpBoost *= 0.60;
  moveVelocity *= 0.75;
  const c=document.getElementById("center");
  c.classList.remove("warping");
  c.style.background="#39ff14";
}
let reverseWarpLock = false;
let holdTimer = null;
let holdStartX = 0;
let holdStartY = 0;
window.addEventListener("pointerdown", e=>{
  if(e.pointerType === "mouse" && e.button !== 0) return;
  holdStartX = e.clientX;
  holdStartY = e.clientY;
  clearTimeout(holdTimer);
  holdTimer = setTimeout(()=>startWarpHold(), 230);
}, {passive:false});
window.addEventListener("pointermove", e=>{
  const moved = Math.hypot(e.clientX-holdStartX, e.clientY-holdStartY);
  if(!warpSteeringActive && moved > 14) clearTimeout(holdTimer);

  if(warpSteeringActive){
    const dx = e.clientX - warpSteerLastX;
    const dy = e.clientY - warpSteerLastY;
    yaw -= dx * 0.0034;
    pitch -= dy * 0.0034;
    pitch = Math.max(-1.55, Math.min(1.55, pitch));
    warpSteerLastX = e.clientX;
    warpSteerLastY = e.clientY;
  }
}, {passive:false});
window.addEventListener("pointerup", ()=>{
  clearTimeout(holdTimer);
  stopWarpHold();
}, {passive:false});
window.addEventListener("pointercancel", ()=>{
  clearTimeout(holdTimer);
  stopWarpHold();
}, {passive:false});

function animateNumber(el, endValue, duration=900){
  const start = performance.now();
  const end = Number(endValue)||0;
  function step(now){
    const t = Math.min(1, (now - start) / duration);
    const eased = 1 - Math.pow(1 - t, 3);
    el.textContent = Math.round(end * eased);
    if(t < 1) requestAnimationFrame(step);
  }
  requestAnimationFrame(step);
}

function getSourceRank(cycle){

  if(cycle >= 10) return "SOURCE";
  if(cycle >= 9) return "COSMIC ARCHITECT";
  if(cycle >= 8) return "VOID WALKER";
  if(cycle >= 7) return "SOURCE MASTER";
  if(cycle >= 6) return "SOURCE SEEKER";
  if(cycle >= 5) return "SIGNAL HUNTER";
  if(cycle >= 4) return "CARTOGRAPHER";
  if(cycle >= 3) return "NAVIGATOR";
  if(cycle >= 2) return "PATHFINDER";

  return "EXPLORER";
}
  
function getDiscoveryTitle(percent){
  if(percent >= 90) return "SOURCE MASTER";
  if(percent >= 75) return "SEEKER";
  if(percent >= 50) return "PATHFINDER";
  if(percent >= 25) return "NAVIGATOR";
  return "EXPLORER";
}

function getDiscoveryTitleByScore(roundScore){
  if(roundScore >= 40000) return "MASTER SEEKER";
  if(roundScore >= 20000) return "NAVIGATOR";
  if(roundScore >= 10000) return "PATHFINDER";
  if(roundScore >= 5000) return "SEEKER";
  return "WANDERER";
}

function continueToNextRound(){
  const panel = document.getElementById("roundComplete");

  // If the LEVEL COMPLETE screen is showing, this tap starts the next level.
  if(levelCompletePending){
    levelCompletePending = false;
    pendingRoundAdvance = false;
    roundPaused = false;

    if(panel) panel.style.display = "none";
    scene.fog.density = baseFogDensity;

    createRound();
    return;
  }

  if(!pendingRoundAdvance) return;

  pendingRoundAdvance = false;
  roundPaused = false;

  if(panel) panel.style.display = "none";
  scene.fog.density = baseFogDensity;

  round += 1;
  saveProgress();

  if(round > 10){

    const avgDiscovery =
      Math.round(
        levelDiscoveryTotal /
        Math.max(1, levelDiscoveryRounds)
      );

    const levelTitle =
      getDiscoveryTitle(avgDiscovery);

    const cycle =
      Math.floor((level - 1) / 10) + 1;
    gtag('event', 'cycle_reached', {
  cycle: cycle
});

   gtag('event', 'highest_level_reached', {
  level: level
});

    const sourceRank =
      getSourceRank(cycle);

    gtag('event', 'rank_earned', {
  rank: sourceRank,
  cycle: cycle
});

    gtag('event', 'level_complete', {
  level: level,
  score: score
});

    if(panel){
      panel.innerHTML = `
        <div class="resultsCard">
          <div class="big">LEVEL COMPLETE</div>

          <div class="small">

            <div class="statLine">
              <span>AVERAGE DISCOVERY</span>
              <span>${avgDiscovery}%</span>
            </div>

            <div class="statLine">
              <span>RATING</span>
              <span>${levelTitle}</span>
            </div>

            <div class="statLine">
              <span>LEVEL</span>
              <span>${level}</span>
            </div>

            <div class="statLine">
              <span>CYCLE</span>
              <span>${cycle}</span>
            </div>

            <div class="statLine">
              <span>SOURCE RANK</span>
              <span>${sourceRank}</span>
            </div>

            <div class="tapContinue">
              TAP TO ADVANCE
            </div>

          </div>
        </div>
      `;

      panel.style.display = "grid";
    }

    levelDiscoveryTotal = 0;
    levelDiscoveryRounds = 0;

    round = 1;
    level += 1;
    saveProgress();
    sphereRadius = 130;

    levelCompletePending = true;
    roundPaused = true;

    return;
  }

  createRound();
}

document.getElementById("roundComplete").addEventListener("pointerdown", e=>{
  e.stopPropagation();
  continueToNextRound();
});


function beaconObject(pos){
  const group = new THREE.Group();
  const tier = 1 + Math.floor(Math.random()*5);
  const tierColors = [
  0xff8800, // orange
  0x66ff66, // green
  0xffffff, // white
  0xff66cc, // purple
  0x55ccff, // cyan
  0xff4444, // red
  0xffd36a  // gold
];
  const tierColor = tierColors[tier-1];

  const core = new THREE.Mesh(
    new THREE.SphereGeometry(1.4 + tier*.08, 32, 32),
    new THREE.MeshBasicMaterial({color:0x444444})
  );

  const aura = new THREE.Mesh(
    new THREE.SphereGeometry(2.8 + tier*.18, 24, 24),
    new THREE.MeshBasicMaterial({
      color:tierColor,
      transparent:true,
      opacity:0.0,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    })
  );

  group.add(aura);
  group.add(core);

  const rings = [];
  for(let i=0;i<tier;i++){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(3.0 + i*0.7, 3.25 + i*0.7, 64),
      new THREE.MeshBasicMaterial({
        color:tierColor,
        transparent:true,
        opacity:0.0,
        side:THREE.DoubleSide,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    );
    group.add(ring);
    rings.push(ring);
  }

  group.position.copy(pos);
  group.userData = {core, aura, ring:rings[0], rings, tier, value:tier*10, tierColor, state:"dormant", fade:1};
  return group;
}

function createRound(){
  updateWorld();
  scene.fog.density = baseFogDensity;

 beacons.forEach(b=>{
  disposeObject(b);
  scene.remove(b);
});
  beacons = [];
  foundCount = 0;
  foundLock = false;
  roundTransitioning = false;
  roundTimer = 60;
  roundStartScore = score;
  roundSourcesFound = 0;

  themeTimer = 0;
  playSourceTheme();

  const count = 1000;

  for(let i=0;i<count;i++){
    const pos = FREEFALL_MODE
      ? randomPointInFreefallField()
      : randomPointInSphere(sphereRadius * 0.90);

    const b = beaconObject(pos);
    scene.add(b);
    beacons.push(b);
  }

  activeIndex = -1;
  beacons.forEach(b=>b.userData.state = "active");

  camera.position.set(0,0,0);
  yaw = Math.PI;
  pitch = 0;
  driftVelocityX = 0;
  driftVelocityY = 0;
  moveVelocity = CRUISE_SPEED;
  beatTimer = 0;
  warpBoost = 0;

  makeInnerParticles();
  createLandmarks();
  updateHUD();
}

function updateHUD(signalText="Signal: listening..."){
  document.getElementById("world").textContent = currentWorld().name;
  document.getElementById("level").textContent = level;
  document.getElementById("round").textContent = round;
  document.getElementById("found").textContent = foundCount;

const totalEl = document.getElementById("total");
if(totalEl){
    totalEl.textContent = beacons.length || round;
}
  document.getElementById("signal").textContent = signalText;
  const s=document.getElementById("score"); if(s) s.textContent=score;
  const b=document.getElementById("bestScore"); if(b) b.textContent=bestScore;
  const c=document.getElementById("combo"); if(c) c.textContent=combo+"x";
  const t=document.getElementById("timer"); if(t) t.textContent=Math.max(0,Math.ceil(roundTimer));
}

loadProgress();

updateWorld(true);

createRound();

let dragging = false, lastX=0, lastY=0;
let activeTouches = new Map();
let lastPinch = null;

renderer.domElement.addEventListener("pointerdown", e=>{
  initAudio();
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activeTouches.size === 1){
    dragging = true; lastX=e.clientX; lastY=e.clientY;
  }
});

renderer.domElement.addEventListener("pointermove", e=>{
  if(!activeTouches.has(e.pointerId)) return;
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(activeTouches.size === 1 && dragging){
    const dx = e.clientX-lastX;
    const dy = e.clientY-lastY;

    if(FREEFALL_MODE){
      driftVelocityX += dx * FREEFALL_DRIFT * 18;
      driftVelocityY += -dy * FREEFALL_DRIFT * 18;
    } else {
      const steerSpeed = (warpHeld || reverseWarpHeld) ? 0.0034 : 0.005;
      yaw -= dx * steerSpeed;
      pitch -= dy * steerSpeed;
      pitch = Math.max(-1.55, Math.min(1.55, pitch));
    }

    lastX=e.clientX; lastY=e.clientY;
  }

  if(activeTouches.size === 2){
    clearTimeout(holdTimer);
    reverseWarpLock = true;
   if(false) startReverseWarp();
    const pts = [...activeTouches.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);

    // SOURCE 10.3 fix:
    // Two-finger hold is reverse warp, not pinch propulsion.
    // This prevents the iPhone slingshot/teleport effect.
    lastPinch = d;

    const dx = pts[0].x - warpSteerLastX;
    const dy = pts[0].y - warpSteerLastY;
    if(FREEFALL_MODE){
      driftVelocityX += dx * FREEFALL_DRIFT * 10;
      driftVelocityY += -dy * FREEFALL_DRIFT * 10;
    } else {
      yaw -= dx * 0.0026;
      pitch -= dy * 0.0026;
      pitch = Math.max(-1.55, Math.min(1.55, pitch));
    }
    warpSteerLastX = pts[0].x;
    warpSteerLastY = pts[0].y;
  }
});

function endPointer(e){
  activeTouches.delete(e.pointerId);
  dragging = false;
  if(activeTouches.size < 2){
    lastPinch = null;
    if(reverseWarpHeld) stopWarpHold();
  }
}
renderer.domElement.addEventListener("pointerup", endPointer);
renderer.domElement.addEventListener("pointercancel", endPointer);

window.addEventListener("wheel", e=>{
  initAudio();
  moveVelocity += -e.deltaY * 0.009;
});

function applySoftBoundary(){

  const d = camera.position.length();
  const maxR = sphereRadius * 0.98;

  if(d > maxR){

    const normal =
      camera.position.clone().normalize();

    camera.position.copy(
      normal.clone().multiplyScalar(maxR)
    );

    const f = forwardVector();

    const outward =
      normal.clone().multiplyScalar(
        f.dot(normal)
      );

    const tangent =
      f.clone().sub(outward);

    if(tangent.lengthSq() > 0.0001){

      tangent.normalize();

      yaw =
        Math.atan2(
          tangent.x,
          tangent.z
        );

      pitch =
        Math.asin(
          tangent.y
        );

      moveVelocity *= 1.02;
    }
  }

  const edgeStart = sphereRadius * 0.78;
  const current = camera.position.length();

  if(current > edgeStart){

    const t = THREE.MathUtils.clamp(
      (current - edgeStart) /
      (maxR - edgeStart),
      0,
      1
    );

    if(moveVelocity > CRUISE_SPEED){

      moveVelocity *= (
        1 - t * 0.02
      );

    }
  }
}


function setNextActive(){
  if(roundTransitioning) return;
  const remaining = beacons.filter(b => b.userData.state !== "collected");
  if(remaining.length === 0){
    roundTransitioning = true;
    playVictoryFanfare();
    showRoundComplete("ROUND COMPLETE");
  }
}

function foundSource(){
  if(foundLock || roundTransitioning || roundPaused) return;

  let closest = null;
  let closestDist = Infinity;
  beacons.forEach(b=>{
    if(b.userData.state === "collected") return;
    const d = camera.position.distanceTo(b.position);
    if(d < closestDist){ closestDist = d; closest = b; }
  });
  if(!closest || closestDist >= (FREEFALL_MODE ? 10.5 : 5.4)) return;

  foundLock = true;
  const b = closest;
  b.userData.state = "collected";
  b.userData.fade = 1;
  foundCount++;
  gtag('event', 'source_found', {
  level: level,
  round: round,
  found: foundCount,
  total_found: foundCount,
  score: score
});
  roundSourcesFound++;

  const nowFound = performance.now();
  combo = (nowFound - lastSourceFoundAt < 10000) ? Math.min(combo + 1, 5) : 1;
  lastSourceFoundAt = nowFound;
  addScore(b.userData.value || 100, "+" + sourceTierLabel(b.userData.tier || 1) + " ");
  discoverySound();
  playCollectionChime(b.userData.tier || 1);
  vibrate([30,40,70]);

  document.getElementById("foundFlash").style.display = "grid";
  setTimeout(()=>document.getElementById("foundFlash").style.display = "none", 460);

  setTimeout(()=>{
    setNextActive();
    foundLock = false;
    updateHUD();
  }, 560);
}


function advanceRoundFromTimer(){
  if(roundTransitioning || foundLock || roundPaused) return;
  roundTransitioning = true;
  combo = 1;
  roundTimer = 0;
  playVictoryFanfare();
  gtag('event', 'round_failed', {
  level: level,
  round: round,
  sources_found: roundSourcesFound
});
  showRoundComplete("TIME COMPLETE");
}


function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = performance.now();
  if(audioCtx){
  themeTimer += dt;

  if(themeTimer > 22){
    themeTimer = 0;
    playSourceTheme();
  }

  // Cosmic radio pings
  if(Math.random() < 0.002){
    playTone(
      600 + Math.random()*400,
      0.15,
      0.012,
      "sine"
    );
  }

  // Tiny signal chirps
  if(Math.random() < 0.001){
    playTone(
      1200 + Math.random()*800,
      0.08,
      0.008,
      "triangle"
    );
  }
}

if(roundPaused){
    updateCamera();
    renderer.render(scene,camera);
    return;
  }

  roundTimer -= dt;
  if(roundTimer <= 0){
    advanceRoundFromTimer();
    return;
  }


  updateCamera();

  const f = FREEFALL_MODE ? new THREE.Vector3(0,0,-1) : forwardVector();

  if(FREEFALL_MODE){
    moveVelocity = CRUISE_SPEED;
    applyFreefallDrift(dt);
    updateFreefallObjects(dt);
    warpBoost = 0;
  } else {
    moveVelocity = THREE.MathUtils.lerp(moveVelocity,CRUISE_SPEED,0.04);
    camera.position.addScaledVector(f, (moveVelocity + warpBoost) * dt * 60);
    applySoftBoundary();
    warpBoost = THREE.MathUtils.clamp(warpBoost, -8, 8);
    moveVelocity = THREE.MathUtils.clamp(moveVelocity, -8, 8);
    moveVelocity *= 0.88;
    if(!warpHeld && !reverseWarpHeld) warpBoost *= 0.90;
  }

 if(innerParticles){

  const pos =
    innerParticles.geometry.attributes.position;

  for(let i=0;i<pos.count;i++){

    let z =
      pos.getZ(i) +
      FREEFALL_SPEED * dt;

    if(z > FREEFALL_NEAR_Z){

      const angle =
        Math.random() * Math.PI * 2;

      const radius =
        Math.sqrt(Math.random()) *
        FREEFALL_RADIUS;

      pos.setXYZ(
        i,
        Math.cos(angle) * radius,
        Math.sin(angle) * radius,
        FREEFALL_FAR_Z -
        Math.random() * 300
      );

    }else{

      pos.setZ(i,z);

    }

  }

  pos.needsUpdate = true;

}

  landmarks.forEach((l,i)=>{
    l.rotation.y += dt * (l.userData.spin || 0.04);
    l.rotation.x += dt * 0.012;
    if(l.userData.drift){
      l.position.addScaledVector(l.userData.drift, dt);
      if(l.position.length() > sphereRadius*0.82) l.userData.drift.multiplyScalar(-1);
    }
  });

  particleRivers.forEach((p,i)=>{
    p.rotation.y += dt * (p.userData.spin || 0.006);
    p.rotation.z += dt * 0.003;
    const pts = p.children[0];
    if(pts && pts.material){
      pts.material.size = 1.2 + Math.min(8.0, Math.abs(moveVelocity + warpBoost)*0.20);
      pts.material.opacity = 0.30 + Math.min(0.22, Math.abs(moveVelocity + warpBoost)*0.012);
    }
  });

  if(outerCosmos){
    outerCosmos.rotation.y += dt * 0.0015;
    outerCosmos.rotation.x += dt * 0.0004;
    outerCosmos.material.size = 2.8 + Math.min(2.6, Math.abs(moveVelocity + warpBoost)*0.06);
    outerCosmos.material.opacity = 0.88 + Math.min(0.10, Math.abs(moveVelocity + warpBoost)*0.004);
  }
  if(midCosmos){
    midCosmos.rotation.y += dt * 0.0009;
    midCosmos.rotation.x += dt * 0.00025;
    midCosmos.material.size = 1.9 + Math.min(2.0, Math.abs(moveVelocity + warpBoost)*0.04);
    midCosmos.material.opacity = 0.44 + Math.min(0.14, Math.abs(moveVelocity + warpBoost)*0.005);
  }
  if(deepCosmos){
    deepCosmos.rotation.y += dt * 0.00045;
    deepCosmos.rotation.x += dt * 0.00012;
    deepCosmos.material.opacity = 0.34 + Math.min(0.10, Math.abs(moveVelocity + warpBoost)*0.004);
  }

  skyObjects.forEach((n,i)=>{
    n.rotation.z += dt * (0.0012 + i*0.00025);
  });

  outerParticleRivers.forEach((p,i)=>{
    p.rotation.z += dt * (p.userData.spin || 0.0015);
    p.rotation.y += dt * 0.0009;
    const pts = p.children[0];
    if(pts && pts.material){
      pts.material.size = 2.0 + Math.min(2.2, Math.abs(moveVelocity + warpBoost)*0.055);
      pts.material.opacity = 0.34 + Math.min(0.20, Math.abs(moveVelocity + warpBoost)*0.009);
    }
  });

  maybeMeteorShower(dt);
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.position.addScaledVector(m.userData.velocity, dt);
    m.userData.life -= dt;
    const fade = Math.max(0, m.userData.life / m.userData.maxLife);
    m.children.forEach(child=>{
      if(child.material) child.material.opacity = Math.min(child.material.opacity, fade);
    });
    if(m.userData.life <= 0){
      scene.remove(m);
      meteors.splice(i,1);
    }
  }

  let active = null;
  let signal = 0;
  let lock = 0;

  beacons.forEach(b=>{
    if(b.userData.state === "collected") return;
    const toBeacon = b.position.clone().sub(camera.position);
    const dist = toBeacon.length();
    const dir = toBeacon.clone().normalize();
    const alignmentRaw = f.dot(dir);
    const alignment = THREE.MathUtils.clamp((alignmentRaw+1)/2, 0, 1);
    const closeness = THREE.MathUtils.clamp(1 - dist/(sphereRadius*1.05), 0, 1);
    const candidateSignal = THREE.MathUtils.clamp(closeness*0.58 + alignment*0.42, 0, 1);
    if(candidateSignal > signal){
      active = b;
      signal = candidateSignal;
      lock = THREE.MathUtils.smoothstep(alignmentRaw, 0.86, 0.985) * THREE.MathUtils.smoothstep(closeness, 0.18, 0.72);
    }
  });

  if(active){
    lastLock = lock;
    const warpPower = 0.85 + signal * 3.2 + lock * 5.2;

    if(warpHeld){
  warpBoost = Math.min(4, warpBoost + warpPower * dt * 1.5);
}

if(reverseWarpHeld){
  warpBoost = Math.max(-3, warpBoost - warpPower * dt * 1);
}

    if(audioCtx && humGain){
      const wi = currentWorldIndex;
      baseGain.gain.value = 0.062 + Math.sin(time*0.0007)*0.012 + (warpHeld ? 0.045 : 0);
      baseOsc.frequency.value = 30 + wi*1.8 + Math.sin(time*0.00045)*2.5;
      shimmerGain.gain.value = 0.012 + lock * 0.026 + (warpHeld ? 0.025 : 0);
      shimmerOsc.frequency.value = 128 + lock * 96 + wi*8 + Math.sin(time*0.001)*7;
      humGain.gain.value = 0.010 + signal * 0.085 + lock * 0.035 + (warpHeld ? 0.028 : 0);
      humOsc.frequency.value = 48 + signal * 58 + lock * 45;

      beatTimer -= dt;
      const interval = THREE.MathUtils.lerp(1.35, 0.15, signal);
      if(signal > 0.13 && beatTimer <= 0){
        heartbeat(signal);
        beatTimer = interval;
      }
    }

    const lockRing = document.getElementById("lockRing");
    lockRing.style.borderColor = "rgba(255,153,0," + (lock*0.72).toFixed(3) + ")";
    lockRing.style.boxShadow = "0 0 " + (18+lock*50).toFixed(0) + "px rgba(255,153,0," + (lock*0.65).toFixed(3) + ")";

    const text = lock > .65 ? "Signal: source lock" :
                 signal < .18 ? "Signal: faint" :
                 signal < .42 ? "Signal: near" :
                 signal < .70 ? "Signal: strong" :
                 "Signal: locked";
    updateHUD(text);

    foundSource();
  }


  beacons.forEach((b,i)=>{
    const {core,aura,ring,rings,state,tierColor} = b.userData;
    const pulse = 1 + Math.sin(time*0.006 + i)*0.06;

    b.lookAt(camera.position);

    if(state === "active"){
      const color = tierColor || 0xff6600;
      core.material.color.set(color);
      aura.material.color.set(color);

      const auraPulse = 1 + Math.sin(time*0.006)*0.28;
      core.scale.setScalar(1 + Math.sin(time*0.010)*0.13);
      aura.scale.setScalar(1.05 + auraPulse + signal*1.45 + lock*0.55);
      aura.material.opacity = 0.01;
      const rr = rings || [ring];
      rr.forEach((r,ri)=>{
        r.material.color.set(color);
        r.scale.setScalar(1.0 + Math.sin(time*0.005 + ri*.75)*0.24 + lock*0.30);
        r.material.opacity = 0.14 + signal*0.22 + lock*0.16;
      });
    }
    else if(state === "collected"){
      b.userData.fade = Math.max(0, (b.userData.fade ?? 1) - dt * 1.6);
      const fade = b.userData.fade;

      core.material.color.set(0x2494ff);
      core.material.transparent = true;
      core.material.opacity = fade;
      core.scale.setScalar(Math.max(0.01, fade));

      aura.material.opacity = 0;

      const rr = rings || [ring];
      rr.forEach(r=>{
        r.material.color.set(0x2494ff);
        r.material.opacity = fade * 0.12;
        r.scale.setScalar(Math.max(0.01, fade));
      });

      if(fade <= 0.02){
        if(FREEFALL_MODE){
          recycleFreefallBeacon(b);
        } else {
          scene.remove(b);
        }
      }
    }
    else {
      core.material.color.set(0x333333);
      core.scale.setScalar(0.85 * pulse);
      aura.material.opacity = 0.0;
      const rr = rings || [ring];
      rr.forEach(r=>r.material.opacity = 0.025);
    }
  });

  renderer.render(scene,camera);
}

animate();

window.addEventListener('beforeunload', () => {

  const sessionSeconds =
    Math.floor((Date.now() - sessionStartTime) / 1000);

  gtag('event', 'session_end', {
    session_length: sessionSeconds,
    level: level,
    round: round,
    score: score
  });

});

document.addEventListener('visibilitychange', () => {

  if(document.hidden){

    gtag('event', 'player_exit', {
      level: level,
      round: round,
      score: score,
      found: foundCount
    });

  }

});

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
