<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOURCE LANE PROTOTYPE</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:white;font-family:Arial,Helvetica,sans-serif;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}canvas{display:block}#gameTitle{position:absolute;top:14px;left:50%;transform:translateX(-50%);z-index:20;font-size:clamp(20px,4vw,30px);font-weight:900;letter-spacing:3px;color:white;text-align:center;white-space:nowrap;text-shadow:0 0 10px rgba(255,255,255,.9),0 0 25px rgba(255,255,255,.5);pointer-events:none}#hud{position:absolute;top:96px;left:14px;z-index:10;background:transparent;font-size:13px;line-height:1.45;letter-spacing:.4px;text-shadow:0 0 8px rgba(255,255,255,.35),0 0 18px rgba(80,180,255,.25);opacity:.9;pointer-events:none}#world{color:#ffd36a;text-shadow:0 0 10px rgba(255,211,106,.65)}#center{position:absolute;left:50%;top:50%;width:20px;height:20px;border-radius:50%;transform:translate(-50%,-50%);background:#ff66cc;border:2px solid rgba(255,255,255,.95);box-shadow:0 0 12px #ff66cc,0 0 28px #ff66cc,0 0 52px rgba(255,102,204,.8);z-index:13;pointer-events:none}#center:after{content:"";position:absolute;left:50%;top:50%;width:42px;height:42px;border-radius:50%;transform:translate(-50%,-50%);border:1px solid rgba(255,102,204,.85);box-shadow:0 0 18px rgba(255,102,204,.7);animation:pulse 1.05s ease-in-out infinite alternate}@keyframes pulse{from{transform:translate(-50%,-50%) scale(.92);opacity:.65}to{transform:translate(-50%,-50%) scale(1.25);opacity:1}}#laneLabel{position:absolute;left:50%;top:calc(50% + 38px);transform:translateX(-50%);z-index:14;font-size:11px;letter-spacing:2px;color:rgba(255,255,255,.65);pointer-events:none;text-shadow:0 0 10px rgba(255,255,255,.45)}#hint{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);width:92%;text-align:center;z-index:9999;font-size:13px;letter-spacing:.8px;color:rgba(255,255,255,.75);pointer-events:none}#roundComplete{position:absolute;inset:0;display:none;place-items:center;text-align:center;z-index:55;pointer-events:auto;background:rgba(0,0,0,.42);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);font-weight:900;letter-spacing:4px;text-shadow:0 0 12px rgba(255,255,255,.55),0 0 36px rgba(255,211,106,.45)}.resultsCard{background:rgba(0,0,0,.74);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.18);border-radius:26px;padding:34px 38px;min-width:min(360px,78vw);box-shadow:0 0 42px rgba(255,255,255,.10),0 0 120px rgba(255,211,106,.12)}.big{font-size:34px;margin-bottom:14px}.statLine{display:flex;justify-content:space-between;gap:28px;border-top:1px solid rgba(255,255,255,.10);padding:8px 0;font-size:15px}.statLine:first-child{border-top:none}.tapContinue{margin-top:18px;font-size:12px;letter-spacing:4px;opacity:.78}.scorePopup{position:absolute;left:50%;top:43%;transform:translate(-50%,-50%);z-index:60;pointer-events:none;font-size:26px;font-weight:900;letter-spacing:2px;color:#ffd36a;text-shadow:0 0 12px rgba(255,211,106,.95),0 0 38px rgba(255,120,0,.6);animation:scoreRise .9s ease-out forwards}@keyframes scoreRise{0%{opacity:0;transform:translate(-50%,-10%) scale(.8)}18%{opacity:1}100%{opacity:0;transform:translate(-50%,-145%) scale(1.08)}}
</style>
</head>
<body>
<div id="gameTitle">SOURCE LANES</div><div id="hud"><div>Mode: <span id="world">9-Lane Prototype</span></div><div>Round: <span id="round">1</span>/10</div><div>Sources: <span id="found">0</span></div><div id="signal">Signal: choose a lane</div><div>Score: <span id="score">0</span></div><div>Best: <span id="bestScore">0</span></div><div>Combo: <span id="combo">1x</span></div><div>Time: <span id="timer">60</span></div></div><div id="center"></div><div id="laneLabel">CENTER</div><div id="roundComplete"></div><div id="hint">Swipe left/right/up/down · Choose the best Source strings · Avoid empty lanes</div>
<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";
const scene=new THREE.Scene();scene.fog=new THREE.FogExp2(0x000000,.0011);const camera=new THREE.PerspectiveCamera(70,innerWidth/innerHeight,.1,5000);camera.position.set(0,0,95);camera.lookAt(0,0,-500);const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.setSize(innerWidth,innerHeight);document.body.appendChild(renderer.domElement);
const LANE_X=[-54,0,54], LANE_Y=[42,0,-42], FAR_Z=-920, NEAR_Z=72, SPEED_START=185, COLLECT_RADIUS=18, TRAIN_GAP=21, ROUND_TIME=60;let laneX=1,laneY=1,targetX=0,targetY=0,score=0,bestScore=Number(localStorage.getItem("sourceLaneBest")||0),foundCount=0,combo=1,lastFoundAt=0,round=1,roundTimer=ROUND_TIME,speed=SPEED_START,spawnTimer=0,trainId=0,paused=false;const clock=new THREE.Clock(),beacons=[],stars=[],laneGuides=[];const TIERS=[{name:"WHITE",color:0xffffff,value:10,size:3.8},{name:"BLUE",color:0x55ccff,value:25,size:4.3},{name:"GREEN",color:0x66ff66,value:50,size:4.8},{name:"ORANGE",color:0xff8800,value:100,size:5.4},{name:"RED",color:0xff4444,value:200,size:6.1}];
function makeStarField(){const count=950,positions=new Float32Array(count*3),colors=new Float32Array(count*3),palette=[0xffffff,0x777777,0x55ccff,0xff66cc,0x5d3dff,0xff8800].map(c=>new THREE.Color(c));for(let i=0;i<count;i++){positions[i*3]=(Math.random()*2-1)*260;positions[i*3+1]=(Math.random()*2-1)*180;positions[i*3+2]=-50-Math.random()*1200;const c=palette[Math.floor(Math.random()*palette.length)].clone().multiplyScalar(.35+Math.random()*.7);colors[i*3]=c.r;colors[i*3+1]=c.g;colors[i*3+2]=c.b}const geo=new THREE.BufferGeometry();geo.setAttribute("position",new THREE.BufferAttribute(positions,3));geo.setAttribute("color",new THREE.BufferAttribute(colors,3));const mat=new THREE.PointsMaterial({size:1.4,sizeAttenuation:true,transparent:true,opacity:.72,vertexColors:true});const pts=new THREE.Points(geo,mat);scene.add(pts);stars.push(pts)}
function makeLaneGuides(){LANE_X.forEach(x=>{LANE_Y.forEach(y=>{const geo=new THREE.BufferGeometry(),positions=[];for(let i=0;i<48;i++)positions.push(x,y,-80-i*26);geo.setAttribute("position",new THREE.Float32BufferAttribute(positions,3));const mat=new THREE.PointsMaterial({color:0xff66cc,size:.85,transparent:true,opacity:.18,sizeAttenuation:true,depthWrite:false});const pts=new THREE.Points(geo,mat);scene.add(pts);laneGuides.push(pts)})})}
function chooseTier(){const r=Math.random();if(r<.42)return TIERS[0];if(r<.68)return TIERS[1];if(r<.84)return TIERS[2];if(r<.95)return TIERS[3];return TIERS[4]}
function makeBeacon(tier,x,y,z,train){const group=new THREE.Group();const core=new THREE.Mesh(new THREE.SphereGeometry(tier.size,18,18),new THREE.MeshBasicMaterial({color:tier.color}));const glow=new THREE.Mesh(new THREE.SphereGeometry(tier.size*1.9,16,16),new THREE.MeshBasicMaterial({color:tier.color,transparent:true,opacity:.09,blending:THREE.AdditiveBlending,depthWrite:false}));group.add(glow);group.add(core);group.position.set(x,y,z);group.userData={core,glow,tier,value:tier.value,state:"active",fade:1,train};scene.add(group);beacons.push(group);return group}
function spawnTrain(){trainId++;const x=LANE_X[Math.floor(Math.random()*3)],y=LANE_Y[Math.floor(Math.random()*3)],tier=chooseTier();let length;if(tier.value>=200)length=3+Math.floor(Math.random()*4);else if(tier.value>=100)length=5+Math.floor(Math.random()*6);else if(tier.value>=50)length=8+Math.floor(Math.random()*8);else length=12+Math.floor(Math.random()*13);const slightCurve=Math.random()<.22,curveX=slightCurve?(Math.random()<.5?-1:1)*8:0,curveY=slightCurve?(Math.random()<.5?-1:1)*6:0;for(let i=0;i<length;i++){const t=i/Math.max(1,length-1);makeBeacon(tier,x+Math.sin(t*Math.PI)*curveX,y+Math.sin(t*Math.PI)*curveY,FAR_Z-i*TRAIN_GAP,trainId)}document.getElementById("signal").textContent="Signal: "+tier.name.toLowerCase()+" string"}
function spawnWave(){const trains=Math.random()<.72?2:3;for(let i=0;i<trains;i++)setTimeout(spawnTrain,i*110)}
function moveLane(dx,dy){laneX=Math.max(0,Math.min(2,laneX+dx));laneY=Math.max(0,Math.min(2,laneY+dy));targetX=LANE_X[laneX];targetY=LANE_Y[laneY];const namesY=["UP","CENTER","DOWN"],namesX=["LEFT","CENTER","RIGHT"];document.getElementById("laneLabel").textContent=namesY[laneY]+" "+namesX[laneX];if(navigator.vibrate)navigator.vibrate(10)}let downX=0,downY=0;window.addEventListener("pointerdown",e=>{downX=e.clientX;downY=e.clientY},{passive:false});window.addEventListener("pointerup",e=>{const dx=e.clientX-downX,dy=e.clientY-downY;if(Math.hypot(dx,dy)<18)return;if(Math.abs(dx)>Math.abs(dy))moveLane(dx>0?1:-1,0);else moveLane(0,dy>0?1:-1)},{passive:false});window.addEventListener("keydown",e=>{if(e.key==="ArrowLeft"||e.key==="a")moveLane(-1,0);if(e.key==="ArrowRight"||e.key==="d")moveLane(1,0);if(e.key==="ArrowUp"||e.key==="w")moveLane(0,-1);if(e.key==="ArrowDown"||e.key==="s")moveLane(0,1)});
function showScorePopup(text){const el=document.createElement("div");el.className="scorePopup";el.textContent=text;document.body.appendChild(el);setTimeout(()=>el.remove(),900)}function collectBeacon(b){if(b.userData.state!=="active")return;b.userData.state="collected";b.userData.fade=1;const now=performance.now();combo=(now-lastFoundAt<1200)?Math.min(combo+1,5):1;lastFoundAt=now;const gained=b.userData.value*combo;score+=gained;foundCount++;if(score>bestScore){bestScore=score;localStorage.setItem("sourceLaneBest",String(bestScore))}showScorePopup("+"+gained);updateHUD();if(navigator.vibrate)navigator.vibrate(6)}
function updateHUD(){document.getElementById("round").textContent=round;document.getElementById("found").textContent=foundCount;document.getElementById("score").textContent=score;document.getElementById("bestScore").textContent=bestScore;document.getElementById("combo").textContent=combo+"x";document.getElementById("timer").textContent=Math.ceil(roundTimer)}
function endRound(){paused=true;const card=document.getElementById("roundComplete");card.innerHTML=`<div class="resultsCard"><div class="big">TIME COMPLETE</div><div class="statLine"><span>ROUND SCORE</span><span>${score}</span></div><div class="statLine"><span>SOURCES</span><span>${foundCount}</span></div><div class="statLine"><span>DISCOVERY</span><span>${foundCount>=180?"MASTER SEEKER":foundCount>=100?"PATHFINDER":"SEEKER"}</span></div><div class="tapContinue">TAP TO RESTART</div></div>`;card.style.display="grid";card.onclick=resetRound}function resetRound(){document.getElementById("roundComplete").style.display="none";beacons.forEach(b=>scene.remove(b));beacons.length=0;score=0;foundCount=0;combo=1;roundTimer=ROUND_TIME;paused=false;laneX=1;laneY=1;targetX=0;targetY=0;updateHUD()}
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05);if(!paused){roundTimer-=dt;if(roundTimer<=0){roundTimer=0;updateHUD();endRound()}speed=SPEED_START+(ROUND_TIME-roundTimer)*1.2;spawnTimer-=dt;if(spawnTimer<=0){spawnTimer=.58+Math.random()*.32;spawnWave()}camera.position.x+=(targetX-camera.position.x)*(1-Math.pow(.0009,dt));camera.position.y+=(targetY-camera.position.y)*(1-Math.pow(.0009,dt));camera.lookAt(camera.position.x,camera.position.y,-500);beacons.forEach(b=>{if(b.userData.state==="active"){b.position.z+=speed*dt;b.lookAt(camera.position);const dz=Math.abs(b.position.z-camera.position.z),dxy=Math.hypot(b.position.x-camera.position.x,b.position.y-camera.position.y);if(dz<42&&dxy<COLLECT_RADIUS)collectBeacon(b);if(b.position.z>NEAR_Z+60)b.userData.state="missed"}if(b.userData.state==="collected"||b.userData.state==="missed"){b.userData.fade-=dt*2.8;const f=Math.max(0,b.userData.fade);b.userData.core.material.transparent=true;b.userData.core.material.opacity=f;b.userData.glow.material.opacity=f*.09;b.scale.setScalar(Math.max(.001,f))}});for(let i=beacons.length-1;i>=0;i--){const b=beacons[i];if((b.userData.state==="collected"||b.userData.state==="missed")&&b.userData.fade<=0){scene.remove(b);beacons.splice(i,1)}}stars.forEach(s=>{const pos=s.geometry.attributes.position;for(let i=0;i<pos.count;i++){let z=pos.getZ(i)+speed*dt*.75;if(z>90)z=-1150-Math.random()*200;pos.setZ(i,z)}pos.needsUpdate=true});updateHUD()}renderer.render(scene,camera)}
window.addEventListener("resize",()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});makeStarField();makeLaneGuides();spawnWave();updateHUD();animate();
</script>
</body>
</html>
