<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#00ff00"><title>Bertie Bert Moves — Kids</title><link rel="stylesheet" href="style.css"></head>
<body><main id="app">
<section class="screen" id="setup"><div class="setup-card"><h1>LET'S MOVE!</h1><label for="pace">TEMPO</label><select id="pace"><option value="turbo">SUPER FAST</option><option value="quick">FAST</option><option value="steady" selected>JUST RIGHT</option><option value="chill">SLOW</option><option value="mixed">SURPRISE!</option></select><label for="duration">HOW LONG?</label><select id="duration"><option value="30">30 SECONDS</option><option value="60">1 MINUTE</option><option value="120">2 MINUTES</option><option value="180">3 MINUTES</option><option value="240">4 MINUTES</option><option value="300">5 MINUTES</option><option value="600">10 MINUTES</option><option value="900">15 MINUTES</option></select><button id="start" class="primary">START!</button></div></section>
<section class="screen hidden" id="round" aria-label="Movement game"><div class="cue-area"><div id="command" aria-live="polite" aria-atomic="true"></div><div class="progressTrack" role="progressbar" aria-label="Time completed" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0"><div id="progress"></div></div></div></section>
<section class="screen hidden" id="done"><div class="setup-card"><h1>YOU DID IT!</h1><button id="again" class="primary">TRY AGAIN!</button><button id="homeBtn">HOME</button></div></section>
</main><script src="words.js"></script><script src="game.js"></script></body></html>
