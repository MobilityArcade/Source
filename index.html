<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>iGusta · Movement Flashcards</title><link rel="stylesheet" href="style.css"></head><body><main id="app" class="shell"><section id="home" class="screen"><header class="brand">iGUSTA</header><p class="tagline">ONE WORD. YOUR MOVE.</p><div class="modes"><button class="mode red" data-mode="dance">DANCE <span>›</span></button><button class="mode blue" data-mode="stretch">STRETCH <span>›</span></button><button class="mode green" data-mode="flow">FLOW <span>›</span></button><button class="mode yellow" data-mode="play">PLAY <span>›</span></button></div><p class="footer-note">NO VOICE. JUST MOVE.</p></section><section id="setup" class="screen hidden"><div class="topline"><button id="back" class="circle" aria-label="Back">←</button><span class="small-brand">iGUSTA</span></div><h1 id="modeTitle">DANCE</h1><div class="settings"><label class="setting"><span id="durationLabel">Duration</span><select id="duration"><option value="30">30 seconds</option><option value="60">1 minute</option><option value="180">3 minutes</option></select></label><label class="setting"><span id="languageLabel">Language</span><select id="language"><option value="en">English</option><option value="es">Español</option></select></label><label class="setting"><span id="paceLabel">Card pace</span><select id="pace"><option value="quick">Quick</option><option value="steady" selected>Steady</option><option value="relaxed">Relaxed</option></select></label><label class="setting"><span id="soundLabel">Sound cues</span><select id="sound"><option value="on">On</option><option value="off">Off</option></select></label></div><button id="start" class="primary">START →</button><p class="hint" id="hint">Read the word. Move your way.</p></section><section id="round" class="screen hidden"><div class="topline roundTop"><span class="small-brand">iGUSTA</span><span id="roundMode">DANCE</span></div><div id="command" aria-live="polite">READY</div><div class="roundBottom"><div class="times"><span id="elapsed">0:00</span><span id="total">0:30</span></div><div class="track"><div id="progress"></div></div><div class="roundButtons"><button id="pause">PAUSE</button><button id="next">NEXT →</button><button id="stop">END</button></div></div></section><section id="done" class="screen hidden"><span class="small-brand">iGUSTA</span><div class="doneCenter"><h1 id="doneTitle">NICE MOVES!</h1><p id="doneDetail">YOUR MOVE. YOUR WAY.</p></div><button id="again" class="primary">PLAY AGAIN ↻</button><button id="homeBtn" class="secondary">HOME</button></section></main><script src="words.js" defer></script><script src="igusta.js" defer></script></body></html>
