<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>SOURCE</title>
<!-- SOURCE 8.8 ROUND TIMER FIX -->
<!-- SOURCE 8.9: Tiered Sources + Stardust -->
<style>
html,body{
  margin:0;height:100%;overflow:hidden;background:#000;color:white;
  font-family:Arial,Helvetica,sans-serif;touch-action:none;
  user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;
}
canvas{display:block}
#hud{
  position:absolute;top:14px;left:14px;z-index:10;
  background:transparent;padding:0;border-radius:0;
  font-size:13px;line-height:1.45;letter-spacing:.4px;
  text-shadow:0 0 8px rgba(255,255,255,.35),0 0 18px rgba(80,180,255,.25);
  opacity:.86;
  pointer-events:none;
}
#title{font-size:18px;font-weight:800;letter-spacing:4px;opacity:.92}
#signal{opacity:.9}
#world{color:#ffd36a;text-shadow:0 0 10px rgba(255,211,106,.65)}
#center{
  position:absolute;left:50%;top:50%;width:18px;height:18px;border-radius:50%;
  transform:translate(-50%,-50%);
  background:#39ff14;
  border:2px solid rgba(255,255,255,.95);
  box-shadow:0 0 12px #39ff14,0 0 28px #39ff14,0 0 48px rgba(57,255,20,.75);
  z-index:13;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  -webkit-touch-callout:none;
}
#center::after{
  content:"";
  position:absolute;left:50%;top:50%;width:34px;height:34px;border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(57,255,20,.75);
  box-shadow:0 0 18px rgba(57,255,20,.55);
}
#center.warping{box-shadow:0 0 18px #39ff14,0 0 42px #39ff14,0 0 90px rgba(57,255,20,.95);}
#lockRing{
  position:absolute;left:50%;top:50%;width:64px;height:64px;border-radius:50%;
  transform:translate(-50%,-50%);
  border:1px solid rgba(255,153,0,0);
  box-shadow:0 0 28px rgba(255,153,0,0);
  z-index:8;pointer-events:none;
}
#foundFlash,#worldFlash{
  position:absolute;inset:0;display:none;place-items:center;text-align:center;
  font-weight:900;letter-spacing:6px;z-index:7;
}
#foundFlash{
  background:radial-gradient(circle,rgba(255,130,0,.48),rgba(0,0,0,.05) 42%,rgba(0,0,0,.9));
  font-size:42px;
}
#worldFlash{
  background:radial-gradient(circle,rgba(120,90,255,.34),rgba(0,0,0,.10) 40%,rgba(0,0,0,.92));
  font-size:34px;
}
#hint{
  position:absolute;bottom:18px;left:50%;transform:translateX(-50%);
  opacity:.62;font-size:13px;letter-spacing:.8px;text-align:center;width:90%;
}
</style>
</head>
<body>
<div id="hud">
  <div id="title">SOURCE</div>
  <div>World: <span id="world">Void</span></div>
  <div>Level: <span id="level">1</span></div>
  <div>Round: <span id="round">1</span>/10</div>
  <div>Found: <span id="found">0</span>/<span id="total">1</span></div>
  <div id="signal">Signal: waiting...</div>
  <div>Score: <span id="score">0</span></div>
  <div>Best: <span id="bestScore">0</span></div>
  <div>Combo: <span id="combo">1x</span></div>
  <div>Time: <span id="timer">60</span></div>
</div>
<div id="center"></div>
<div id="lockRing"></div>
<div id="foundFlash">FOUND</div>
<div id="worldFlash"></div>
<div id="hint">Drag to look · Pinch / wheel to drift · Hold anywhere to warp · Find the Source</div>

<script type="module">
import * as THREE from "https://unpkg.com/three@0.160.0/build/three.module.js";

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x000000, 0.00095);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, 0.1, 30000);
camera.position.set(0, 0, 85);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

let level = 1;
let round = 1;
let sphereRadius = 130;
let beacons = [];
let activeIndex = 0;
let foundCount = 0;
let score = 0;
let bestScore = Number(localStorage.getItem('sourceBestScore')||0);
let combo = 1;
let roundTimer = 60;
let lastSourceFoundAt = 0;
let stardust = [];
let innerParticles;
let outerCosmos;
let skyObjects = [];
let landmarks = [];
let particleRivers = [];
let outerParticleRivers = [];
let meteors = [];
let nextMeteorTime = 3 + Math.random()*5;
let warpHeld = false;
let warpBoost = 0;
let lastLock = 0;
let currentWorldIndex = -1;
let yaw = Math.PI;
let pitch = 0;
let moveVelocity = 0;
let foundLock = false;
let roundTransitioning = false;
const clock = new THREE.Clock();

const WORLDS = [
  {name:"Void",       colors:[0x1d2cff,0x5d3dff,0xb24fff,0xff4fa3,0xffffff,0x6dd6ff], fog:0.00100, accent:0x8aa2ff},
  {name:"Nebula",     colors:[0x9b6dff,0xff4fa3,0xff7bd5,0x6dd6ff,0xffffff,0xffd36a], fog:0.00108, accent:0xb36dff},
  {name:"Galaxy",     colors:[0xffffff,0xffd36a,0xff8a3d,0x6d8cff,0xb36dff,0x8fffff], fog:0.00092, accent:0xffd36a},
  {name:"Singularity",colors:[0xff3d6e,0xff6a00,0x7b3cff,0x1d2cff,0xffffff,0x111133], fog:0.00118, accent:0xff3d6e},
  {name:"Aurora",     colors:[0x5dffb4,0x8fffff,0xb36dff,0xff7bd5,0xffffff,0xffd36a], fog:0.00102, accent:0x5dffb4},
  {name:"Resonance",  colors:[0x39ff14,0x9b6dff,0xffd36a,0x8fffff,0xffffff,0xff7bd5], fog:0.00097, accent:0x39ff14},
  {name:"Ascension",  colors:[0xffffff,0xffd36a,0xff7bd5,0x8fffff,0xb36dff,0x5dffb4], fog:0.00087, accent:0xffffff}
];

let audioCtx, baseOsc, baseGain, shimmerOsc, shimmerGain, humOsc, humGain, beatOsc, beatGain, resonanceOsc, resonanceGain;
let beatTimer = 0;

function initAudio(){
  if(audioCtx) {
    if(audioCtx.state !== "running") audioCtx.resume();
    return;
  }
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  baseOsc = audioCtx.createOscillator();
  baseGain = audioCtx.createGain();
  baseOsc.type = "sine";
  baseOsc.frequency.value = 34;
  baseGain.gain.value = 0.07;
  baseOsc.connect(baseGain).connect(audioCtx.destination);
  baseOsc.start();

  shimmerOsc = audioCtx.createOscillator();
  shimmerGain = audioCtx.createGain();
  shimmerOsc.type = "sine";
  shimmerOsc.frequency.value = 144;
  shimmerGain.gain.value = 0.013;
  shimmerOsc.connect(shimmerGain).connect(audioCtx.destination);
  shimmerOsc.start();

  humOsc = audioCtx.createOscillator();
  humGain = audioCtx.createGain();
  humOsc.type = "sine";
  humOsc.frequency.value = 52;
  humGain.gain.value = 0.012;
  humOsc.connect(humGain).connect(audioCtx.destination);
  humOsc.start();

  beatOsc = audioCtx.createOscillator();
  beatGain = audioCtx.createGain();
  beatOsc.type = "triangle";
  beatOsc.frequency.value = 82;
  beatGain.gain.value = 0.0001;
  beatOsc.connect(beatGain).connect(audioCtx.destination);
  beatOsc.start();

  resonanceOsc = audioCtx.createOscillator();
  resonanceGain = audioCtx.createGain();
  resonanceOsc.type = "sine";
  resonanceOsc.frequency.value = 220;
  resonanceGain.gain.value = 0.0001;
  resonanceOsc.connect(resonanceGain).connect(audioCtx.destination);
  resonanceOsc.start();
}

function heartbeat(intensity){
  if(!audioCtx || !beatGain) return;
  const now = audioCtx.currentTime;
  beatOsc.frequency.setValueAtTime(72 + intensity * 76, now);
  beatGain.gain.cancelScheduledValues(now);
  beatGain.gain.setValueAtTime(0.0001, now);
  beatGain.gain.exponentialRampToValueAtTime(0.08 + intensity * 0.24, now + 0.025);
  beatGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.19);
}

function discoverySound(){
  if(!audioCtx || !resonanceGain) return;
  const now = audioCtx.currentTime;
  resonanceOsc.frequency.cancelScheduledValues(now);
  resonanceGain.gain.cancelScheduledValues(now);
  resonanceOsc.frequency.setValueAtTime(120, now);
  resonanceOsc.frequency.exponentialRampToValueAtTime(620, now + 0.75);
  resonanceGain.gain.setValueAtTime(0.0001, now);
  resonanceGain.gain.exponentialRampToValueAtTime(0.25, now + 0.06);
  resonanceGain.gain.exponentialRampToValueAtTime(0.0001, now + 1.25);
}

function forwardVector(){
  return new THREE.Vector3(
    Math.sin(yaw)*Math.cos(pitch),
    Math.sin(pitch),
    Math.cos(yaw)*Math.cos(pitch)
  ).normalize();
}

function updateCamera(){
  const f = forwardVector();
  camera.lookAt(camera.position.clone().add(f));
}

function randomPointInSphere(radius){
  const u = Math.random();
  const v = Math.random();
  const theta = u * Math.PI * 2;
  const phi = Math.acos(2*v - 1);
  const r = radius * Math.cbrt(Math.random());
  return new THREE.Vector3(
    r * Math.sin(phi) * Math.cos(theta),
    r * Math.sin(phi) * Math.sin(theta),
    r * Math.cos(phi)
  );
}

function currentWorld(){
  const index = Math.floor((level - 1)) % WORLDS.length;
  return WORLDS[index];
}

function updateWorld(force=false){
  const index = Math.floor((level - 1)) % WORLDS.length;
  if(!force && index === currentWorldIndex) return;
  currentWorldIndex = index;
  const world = WORLDS[index];

  scene.fog.density = world.fog;
  document.getElementById("world").textContent = world.name;
  makeOuterCosmos(world);

  if(level > 1 || force){
    const wf = document.getElementById("worldFlash");
    wf.innerHTML = world.name.toUpperCase();
    wf.style.display = "grid";
    setTimeout(()=>wf.style.display = "none", 1200);
  }
}

function makeInnerParticles(){
  if(innerParticles) scene.remove(innerParticles);

  const count = 1550;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const world = currentWorld();
  const palette = world.colors.map(c => new THREE.Color(c)).concat([
    new THREE.Color(0xffffff), new THREE.Color(0x777777)
  ]);

  for(let i=0;i<count;i++){
    const p = randomPointInSphere(sphereRadius * 0.98);
    positions[i*3] = p.x;
    positions[i*3+1] = p.y;
    positions[i*3+2] = p.z;

    const c = palette[Math.floor(Math.random()*palette.length)].clone();
    const dim = 0.30 + Math.random() * 0.50;
    c.multiplyScalar(dim);
    colors[i*3] = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors,3));

  const mat = new THREE.PointsMaterial({
    size:0.9,
    sizeAttenuation:true,
    transparent:true,
    opacity:0.78,
    vertexColors:true
  });

  innerParticles = new THREE.Points(geo, mat);
  scene.add(innerParticles);
}

function createSkyPointCloud(world, count, radius, size, opacity){
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const palette = world.colors.map(c => new THREE.Color(c));

  for(let i=0;i<count;i++){
    const u = Math.random();
    const v = Math.random();
    const theta = u * Math.PI * 2;
    const phi = Math.acos(2*v - 1);
    const jitter = radius + (Math.random()*2-1)*120;

    positions[i*3] = jitter * Math.sin(phi) * Math.cos(theta);
    positions[i*3+1] = jitter * Math.sin(phi) * Math.sin(theta);
    positions[i*3+2] = jitter * Math.cos(phi);

    const c = palette[Math.floor(Math.random()*palette.length)].clone();
    c.multiplyScalar(0.42 + Math.random()*0.72);
    colors[i*3] = c.r;
    colors[i*3+1] = c.g;
    colors[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors,3));

  const mat = new THREE.PointsMaterial({
    size, sizeAttenuation:true, transparent:true, opacity, vertexColors:true
  });

  return new THREE.Points(geo, mat);
}

function addNebulaCluster(color, position, scale=1, cloudCount=26){
  const group = new THREE.Group();
  for(let i=0;i<cloudCount;i++){
    const g = new THREE.SphereGeometry(24 + Math.random()*38, 24, 24);
    const m = new THREE.MeshBasicMaterial({
      color,
      transparent:true,
      opacity:0.022 + Math.random()*0.044,
      blending:THREE.AdditiveBlending,
      depthWrite:false
    });
    const s = new THREE.Mesh(g,m);
    s.position.set((Math.random()*2-1)*280*scale, (Math.random()*2-1)*115*scale, (Math.random()*2-1)*90);
    s.scale.set(3.0 + Math.random()*4.5, 0.9 + Math.random()*1.7, 0.7);
    group.add(s);
  }
  group.position.copy(position);
  group.lookAt(0,0,0);
  scene.add(group);
  skyObjects.push(group);
  return group;
}

function addGalaxy(color, position, scale=1){
  const group = new THREE.Group();
  for(let arm=0; arm<3; arm++){
    for(let i=0;i<90;i++){
      const t = i/90 * Math.PI * 2.4 + arm * Math.PI*2/3;
      const r = i * 2.3 * scale;
      const g = new THREE.SphereGeometry(6 + Math.random()*12, 12, 12);
      const m = new THREE.MeshBasicMaterial({
        color: i%3===0 ? 0xffffff : color,
        transparent:true,
        opacity:0.05,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      });
      const s = new THREE.Mesh(g,m);
      s.position.set(Math.cos(t)*r, Math.sin(t)*r*0.42, (Math.random()*2-1)*40);
      s.scale.set(2.2,1.1,1);
      group.add(s);
    }
  }
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(46*scale, 32, 32),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.09, blending:THREE.AdditiveBlending, depthWrite:false})
  );
  group.add(core);
  group.position.copy(position);
  group.lookAt(0,0,0);
  scene.add(group);
  skyObjects.push(group);
}

function addSingularity(position, scale=1){
  const group = new THREE.Group();
  const black = new THREE.Mesh(
    new THREE.SphereGeometry(70*scale, 48, 48),
    new THREE.MeshBasicMaterial({color:0x000000})
  );
  group.add(black);
  for(let i=0;i<5;i++){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry((92+i*20)*scale, (98+i*20)*scale, 96),
      new THREE.MeshBasicMaterial({
        color:i%2?0xff3d6e:0x7b3cff,
        transparent:true,
        opacity:0.16-i*0.018,
        side:THREE.DoubleSide,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    );
    ring.rotation.z = i*0.28;
    ring.scale.y = 0.38 + i*0.04;
    group.add(ring);
  }
  group.position.copy(position);
  group.lookAt(0,0,0);
  scene.add(group);
  skyObjects.push(group);
}

function addAurora(position, colors){
  const group = new THREE.Group();
  colors.forEach((color,idx)=>{
    for(let i=0;i<22;i++){
      const g = new THREE.SphereGeometry(18 + Math.random()*22, 16, 16);
      const m = new THREE.MeshBasicMaterial({
        color,
        transparent:true,
        opacity:0.025,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      });
      const s = new THREE.Mesh(g,m);
      const x = (i-11)*42;
      const y = Math.sin(i*.7+idx)*70 + idx*38;
      s.position.set(x,y,(Math.random()*2-1)*45);
      s.scale.set(4.5,1.0,0.7);
      group.add(s);
    }
  });
  group.position.copy(position);
  group.lookAt(0,0,0);
  scene.add(group);
  skyObjects.push(group);
}

function addResonanceGeometry(position){
  const group = new THREE.Group();
  const color = 0x39ff14;
  for(let i=0;i<7;i++){
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(60+i*28, 62+i*28, 96),
      new THREE.MeshBasicMaterial({
        color:i%2?0x9b6dff:color,
        transparent:true,
        opacity:0.08,
        side:THREE.DoubleSide,
        blending:THREE.AdditiveBlending,
        depthWrite:false
      })
    );
    ring.rotation.z = i * 0.26;
    ring.rotation.x = i * 0.11;
    group.add(ring);
  }
  group.position.copy(position);
  group.lookAt(0,0,0);
  scene.add(group);
  skyObjects.push(group);
}


function createOuterParticleRiver(world, position, scale=1){
  const group = new THREE.Group();
  const palette = (world.colors || [0xffffff,0x9b6dff,0xffd36a]).map(c => new THREE.Color(c));
  const count = 1700 + Math.floor(Math.random()*1200);
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  const length = 850 * scale;
  const width = 105 * scale;

  for(let i=0;i<count;i++){
    positions[i*3] = (Math.random()*2-1) * length;
    positions[i*3+1] = (Math.random()*2-1) * width * (0.25 + Math.random()*0.75);
    positions[i*3+2] = (Math.random()*2-1) * width * (0.25 + Math.random()*0.75);
    const c = palette[Math.floor(Math.random()*palette.length)].clone();
    c.multiplyScalar(0.34 + Math.random()*0.66);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors,3));
  const mat = new THREE.PointsMaterial({
    size:2.0, sizeAttenuation:true, transparent:true, opacity:0.38,
    vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
  const river = new THREE.Points(geo, mat);
  group.add(river);
  group.position.copy(position);
  group.lookAt(0,0,0);
  group.rotation.z += Math.random()*Math.PI;
  group.userData.spin = 0.0015 + Math.random()*0.0025;
  scene.add(group);
  outerParticleRivers.push(group);
}

function createOuterHaloBand(world, position, scale=1){
  const group = new THREE.Group();
  const colors = world.colors || [0xffffff,0xffd36a,0x9b6dff];
  const ringCount = 4 + Math.floor(Math.random()*4);
  for(let i=0;i<ringCount;i++){
    const r = (180 + i*54 + Math.random()*35) * scale;
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(r, r + 3 + Math.random()*6, 192),
      new THREE.MeshBasicMaterial({
        color:colors[Math.floor(Math.random()*colors.length)],
        transparent:true, opacity:0.035 + Math.random()*0.045,
        side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false
      })
    );
    ring.rotation.x = Math.PI/2 + (Math.random()*0.6-0.3);
    ring.rotation.y = Math.random()*Math.PI;
    ring.rotation.z = Math.random()*Math.PI;
    group.add(ring);
  }
  group.position.copy(position);
  group.lookAt(0,0,0);
  group.userData.spin = 0.001 + Math.random()*0.002;
  scene.add(group);
  outerParticleRivers.push(group);
}

function createShootingStar(){
  const world = currentWorld();
  const colors = world.colors || [0xffffff,0x8fffff,0xffd36a];
  const group = new THREE.Group();

  const head = new THREE.Mesh(
    new THREE.SphereGeometry(3.5, 16, 16),
    new THREE.MeshBasicMaterial({
      color:colors[Math.floor(Math.random()*colors.length)],
      transparent:true, opacity:0.95,
      blending:THREE.AdditiveBlending, depthWrite:false
    })
  );
  group.add(head);

  const count = 70;
  const positions = new Float32Array(count*3);
  const cols = new Float32Array(count*3);
  for(let i=0;i<count;i++){
    positions[i*3] = 0;
    positions[i*3+1] = 0;
    positions[i*3+2] = i * 3.2;
    const c = new THREE.Color(i%2 ? 0xffffff : colors[Math.floor(Math.random()*colors.length)]);
    c.multiplyScalar(1 - i/count*0.75);
    cols[i*3] = c.r; cols[i*3+1] = c.g; cols[i*3+2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(cols,3));
  const mat = new THREE.PointsMaterial({
    size:2.4, sizeAttenuation:true, transparent:true, opacity:0.72,
    vertexColors:true, blending:THREE.AdditiveBlending, depthWrite:false
  });
  group.add(new THREE.Points(geo, mat));

  group.position.copy(randomPointInSphere(sphereRadius * 1.65));
  const dir = randomPointInSphere(1).normalize();
  group.userData.velocity = dir.multiplyScalar(180 + Math.random()*160);
  group.userData.life = 1.8 + Math.random()*1.2;
  group.userData.maxLife = group.userData.life;
  group.lookAt(group.position.clone().sub(group.userData.velocity));
  scene.add(group);
  meteors.push(group);
}

function maybeMeteorShower(dt){
  nextMeteorTime -= dt;
  if(nextMeteorTime <= 0){
    const burst = Math.random() < 0.22;
    const count = burst ? 5 + Math.floor(Math.random()*7) : 1;
    for(let i=0;i<count;i++) setTimeout(()=>createShootingStar(), i*120);
    nextMeteorTime = burst ? 18 + Math.random()*22 : 7 + Math.random()*12;
  }
}


function makeOuterCosmos(world){
  if(outerCosmos) scene.remove(outerCosmos);
  skyObjects.forEach(o => scene.remove(o));
  outerParticleRivers.forEach(o => scene.remove(o));
  skyObjects = [];
  outerParticleRivers = [];

  outerCosmos = createSkyPointCloud(world, 9000, 2600, 2.6, 0.86);
  scene.add(outerCosmos);

function clearLandmarks(){

}

function addLandmark(obj){
  obj.userData.landmark = true;

}

function createRingPlanet(pos, color=0x7aa2ff){
  const group = new THREE.Group();
  const planetRadius = 10 + Math.random()*9;
  const planet = new THREE.Mesh(
    new THREE.SphereGeometry(planetRadius, 36, 36),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.72})
  );
  const aura = new THREE.Mesh(
    new THREE.SphereGeometry(planetRadius*1.45, 36, 36),
    new THREE.MeshBasicMaterial({color, transparent:true, opacity:0.055, blending:THREE.AdditiveBlending, depthWrite:false})
  );
  group.add(aura, planet);

  const ringSystems = [
    [{inner:1.55, outer:2.35, opacity:.25}],
    [{inner:1.45, outer:1.70, opacity:.22},{inner:2.05, outer:2.70, opacity:.16}],
    [{inner:1.35, outer:1.55, opacity:.20},{inner:1.75, outer:2.15, opacity:.18},{inner:2.45, outer:3.10, opacity:.13}],
    [{inner:1.25, outer:1.38, opacity:.18},{inner:1.55, outer:2.45, opacity:.20},{inner:2.75, outer:2.95, opacity:.12},{inner:3.18, outer:3.45, opacity:.10}]
  ];
  const chosen = ringSystems[Math.floor(Math.random()*ringSystems.length)];
  chosen.forEach((rs, idx)=>{
    const ring = new THREE.Mesh(
      new THREE.RingGeometry(planetRadius*rs.inner, planetRadius*rs.outer, 128),
      new THREE.MeshBasicMaterial({
        color: idx % 2 ? 0xffffff : 0xffd36a,
        transparent:true, opacity:rs.opacity,
        side:THREE.DoubleSide, blending:THREE.AdditiveBlending, depthWrite:false
      })
    );
    ring.rotation.x = Math.PI/2 + (Math.random()*0.8-0.4);
    ring.rotation.y = Math.random()*Math.PI;
    group.add(ring);
  });

  group.position.copy(pos);
  group.scale.setScalar(0.75 + Math.random()*0.55);
  group.userData.spin = 0.08 + Math.random()*0.08;
  addLandmark(group);
}

function createParticleRiver(pos){

function createComet(pos){
  const group = new THREE.Group();
  const core = new THREE.Mesh(
    new THREE.SphereGeometry(4.5, 24, 24),
    new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.75, blending:THREE.AdditiveBlending})
  );

    positions[i*3+1] = (Math.random()*2-1)*5;
    positions[i*3+2] = 8 + Math.random()*58;
    const c = new THREE.Color(i%2 ? 0x8fffff : 0xffffff);
    c.multiplyScalar(0.45 + Math.random()*0.45);
    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.BufferAttribute(positions,3));
  geo.setAttribute("color", new THREE.BufferAttribute(colors,3));
  const mat = new THREE.PointsMaterial({
    size:1.4, sizeAttenuation:true, transparent:true, opacity:0.36,

  });
  group.add(new THREE.Points(geo, mat));

function createLandmarks(){
  clearLandmarks();
  const world = currentWorld();
  const colors = world.colors || [0xffffff,0x9b6dff,0xffd36a];
  const landmarkCount = Math.min(5, 1 + Math.floor(level/3));
  const types = ["ring","moon","asteroids","orbitalRings","particleRiver","comet"];

  for(let i=0;i<landmarkCount;i++){
    const type = types[Math.floor(Math.random()*types.length)];
    const pos = randomLandmarkPosition();
    const color = colors[Math.floor(Math.random()*colors.length)];
    if(type === "ring") createRingPlanet(pos, color);
    else if(type === "moon") createCraterMoon(pos);
    else if(type === "asteroids") createAsteroidCluster(pos);
    else if(type === "orbitalRings") createOrbitalRingField(pos);
    else if(type === "particleRiver") createParticleRiver(pos);
    else createComet(pos);
  }
}

function createRound(){
  updateWorld();

  beacons.forEach(b => scene.remove(b));
  beacons = [];
  foundCount = 0;
  foundLock = false;
  roundTransitioning = false;
  roundTimer = 60;

  const count = round;
  const minSpacing = Math.max(14, sphereRadius * 0.12);

  for(let i=0;i<count;i++){
    let pos = randomPointInSphere(sphereRadius * 0.72);
    let tries = 0;
    while(tries < 80 && beacons.some(b => b.position.distanceTo(pos) < minSpacing)){
      pos = randomPointInSphere(sphereRadius * 0.72);
      tries++;
    }
    const b = beaconObject(pos);
    scene.add(b);
    beacons.push(b);
  }

  activeIndex = Math.floor(Math.random() * beacons.length);
  beacons[activeIndex].userData.state = "active";

  camera.position.set(0, 0, sphereRadius * 0.55);
  yaw = Math.PI;
  pitch = 0;
  moveVelocity = 0;
  beatTimer = 0;

  makeInnerParticles();
  createLandmarks();
  updateHUD();
}

function updateHUD(signalText="Signal: listening..."){
  document.getElementById("world").textContent = currentWorld().name;
  document.getElementById("level").textContent = level;
  document.getElementById("round").textContent = round;
  document.getElementById("found").textContent = foundCount;
  document.getElementById("total").textContent = round;
  document.getElementById("signal").textContent = signalText;
  const s=document.getElementById("score"); if(s) s.textContent=score;
  const b=document.getElementById("bestScore"); if(b) b.textContent=bestScore;
  const c=document.getElementById("combo"); if(c) c.textContent=combo+"x";
  const t=document.getElementById("timer"); if(t) t.textContent=Math.max(0,Math.ceil(roundTimer));
}

updateWorld(true);
createRound();

let dragging = false, lastX=0, lastY=0;
let activeTouches = new Map();
let lastPinch = null;

renderer.domElement.addEventListener("pointerdown", e=>{
  initAudio();
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(activeTouches.size === 1){
    dragging = true; lastX=e.clientX; lastY=e.clientY;
  }
});

renderer.domElement.addEventListener("pointermove", e=>{
  if(!activeTouches.has(e.pointerId)) return;
  activeTouches.set(e.pointerId,{x:e.clientX,y:e.clientY});

  if(activeTouches.size === 1 && dragging){
    const dx = e.clientX-lastX;
    const dy = e.clientY-lastY;
    yaw -= dx * 0.005;
    pitch -= dy * 0.005;
    pitch = Math.max(-1.55, Math.min(1.55, pitch));
    lastX=e.clientX; lastY=e.clientY;
  }

  if(activeTouches.size === 2){
    const pts = [...activeTouches.values()];
    const d = Math.hypot(pts[0].x-pts[1].x, pts[0].y-pts[1].y);
    if(lastPinch !== null){
      const delta = d - lastPinch;
      moveVelocity += delta * 0.022;
    }
    lastPinch = d;
  }
});

function endPointer(e){
  activeTouches.delete(e.pointerId);
  dragging = false;
  if(activeTouches.size < 2) lastPinch = null;
}
renderer.domElement.addEventListener("pointerup", endPointer);
renderer.domElement.addEventListener("pointercancel", endPointer);

window.addEventListener("wheel", e=>{
  initAudio();
  moveVelocity += -e.deltaY * 0.009;
});

function applySoftBoundary(){
  const d = camera.position.length();
  const maxR = sphereRadius * 0.94;
  if(d > maxR){
    const normal = camera.position.clone().normalize();
    camera.position.copy(normal.multiplyScalar(maxR));
    const f = forwardVector();
    if(f.dot(normal) > 0) moveVelocity *= 0.18;
  }
  const edgeStart = sphereRadius * 0.78;
  const current = camera.position.length();
  if(current > edgeStart){
    const t = THREE.MathUtils.clamp((current - edgeStart) / (maxR - edgeStart), 0, 1);
    if(moveVelocity > 0) moveVelocity *= (1 - t * 0.55);
  }
}

function setNextActive(){
  if(roundTransitioning) return;

  const remaining = [];
  beacons.forEach((b,i)=>{
    if(b.userData.state !== "complete") remaining.push(i);
  });

  if(remaining.length === 0){
    roundTransitioning = true;

    setTimeout(()=>{
      round += 1;
      if(round > 10){
        round = 1;
        level += 1;
        sphereRadius *= 1.18;
      }
      createRound();
    }, 900);
    return;
  }

  activeIndex = remaining[Math.floor(Math.random() * remaining.length)];
  beacons[activeIndex].userData.state = "active";
}

function foundSource(){
  if(foundLock || roundTransitioning) return;

  foundLock = true;
  const b = beacons[activeIndex];
  if(!b || b.userData.state === "complete") {
    foundLock = false;
    return;
  }

  b.userData.state = "complete";
  foundCount++;
  const nowFound = performance.now();
  combo = (nowFound - lastSourceFoundAt < 10000) ? Math.min(combo + 1, 5) : 1;
  lastSourceFoundAt = nowFound;
  score += 100 * combo;
  if(score > bestScore){
    bestScore = score;
    localStorage.setItem('sourceBestScore', String(bestScore));
  }
  discoverySound();

  document.getElementById("foundFlash").style.display = "grid";
  setTimeout(()=>document.getElementById("foundFlash").style.display = "none", 460);

  setTimeout(()=>{
    setNextActive();
    foundLock = false;
    updateHUD();
  }, 560);
}


function advanceRoundFromTimer(){
  if(roundTransitioning || foundLock) return;
  roundTransitioning = true;
  combo = 1;
  roundTimer = 60;

  setTimeout(()=>{
    round += 1;
    if(round > 10){
      round = 1;
      level += 1;
      sphereRadius *= 1.18;
    }
    createRound();
  }, 250);
}

function animate(){
  requestAnimationFrame(animate);
  const dt = Math.min(clock.getDelta(), 0.05);
  const time = performance.now();

  roundTimer -= dt;
  if(roundTimer <= 0){
    advanceRoundFromTimer();
    return;
  }


  updateCamera();

  const f = forwardVector();
  camera.position.addScaledVector(f, (moveVelocity + warpBoost) * dt * 50);
  applySoftBoundary();
  moveVelocity *= 0.93;
  warpBoost *= 0.90;

  if(innerParticles){
    innerParticles.rotation.y += dt * (0.006 + Math.abs(moveVelocity + warpBoost)*0.0009);
    innerParticles.rotation.x += dt * 0.002;
    innerParticles.position.x = Math.sin(time * 0.00012) * 0.9;
    innerParticles.position.y = Math.cos(time * 0.0001) * 0.65;
    innerParticles.material.size = 0.9 + Math.min(2.4, Math.abs(moveVelocity + warpBoost)*0.08);
    innerParticles.material.opacity = 0.74 + Math.min(0.18, Math.abs(moveVelocity + warpBoost)*0.01);
  }

  landmarks.forEach((l,i)=>{
    l.rotation.y += dt * (l.userData.spin || 0.04);
    l.rotation.x += dt * 0.012;
    if(l.userData.drift){
      l.position.addScaledVector(l.userData.drift, dt);
      if(l.position.length() > sphereRadius*0.82) l.userData.drift.multiplyScalar(-1);
    }
  });

  particleRivers.forEach((p,i)=>{
    p.rotation.y += dt * (p.userData.spin || 0.006);
    p.rotation.z += dt * 0.003;
    const pts = p.children[0];
    if(pts && pts.material){
      pts.material.size = 1.2 + Math.min(2.6, Math.abs(moveVelocity + warpBoost)*0.08);
      pts.material.opacity = 0.30 + Math.min(0.22, Math.abs(moveVelocity + warpBoost)*0.012);
    }
  });

  if(outerCosmos){
    outerCosmos.rotation.y += dt * 0.0015;
    outerCosmos.rotation.x += dt * 0.0004;
  }

  skyObjects.forEach((n,i)=>{
    n.rotation.z += dt * (0.0012 + i*0.00025);
  });

  outerParticleRivers.forEach((p,i)=>{
    p.rotation.z += dt * (p.userData.spin || 0.0015);
    p.rotation.y += dt * 0.0009;
    const pts = p.children[0];
    if(pts && pts.material){
      pts.material.size = 2.0 + Math.min(2.2, Math.abs(moveVelocity + warpBoost)*0.055);
      pts.material.opacity = 0.34 + Math.min(0.20, Math.abs(moveVelocity + warpBoost)*0.009);
    }
  });

  maybeMeteorShower(dt);
  for(let i=meteors.length-1;i>=0;i--){
    const m = meteors[i];
    m.position.addScaledVector(m.userData.velocity, dt);
    m.userData.life -= dt;
    const fade = Math.max(0, m.userData.life / m.userData.maxLife);
    m.children.forEach(child=>{
      if(child.material) child.material.opacity = Math.min(child.material.opacity, fade);
    });
    if(m.userData.life <= 0){
      scene.remove(m);
      meteors.splice(i,1);
    }
  }

  const active = beacons[activeIndex];
  let signal = 0;
  let lock = 0;

  if(active && active.userData.state === "active"){
    const toBeacon = active.position.clone().sub(camera.position);
    const dist = toBeacon.length();
    const dir = toBeacon.clone().normalize();
    const alignmentRaw = f.dot(dir);
    const alignment = THREE.MathUtils.clamp((alignmentRaw+1)/2, 0, 1);
    const closeness = THREE.MathUtils.clamp(1 - dist/(sphereRadius*1.05), 0, 1);
    signal = THREE.MathUtils.clamp(closeness*0.58 + alignment*0.42, 0, 1);
    lock = THREE.MathUtils.smoothstep(alignmentRaw, 0.86, 0.985) * THREE.MathUtils.smoothstep(closeness, 0.18, 0.72);
    lastLock = lock;
    if(warpHeld){
      const warpPower = 0.85 + signal * 3.2 + lock * 5.2;
      warpBoost = Math.min(18, warpBoost + warpPower * dt * 7);
    }

    if(audioCtx && humGain){
      const wi = currentWorldIndex;
      baseGain.gain.value = 0.062 + Math.sin(time*0.0007)*0.012 + (warpHeld ? 0.045 : 0);
      baseOsc.frequency.value = 30 + wi*1.8 + Math.sin(time*0.00045)*2.5;

      shimmerGain.gain.value = 0.012 + lock * 0.026 + (warpHeld ? 0.025 : 0);
      shimmerOsc.frequency.value = 128 + lock * 96 + wi*8 + Math.sin(time*0.001)*7;

      humGain.gain.value = 0.010 + signal * 0.085 + lock * 0.035 + (warpHeld ? 0.028 : 0);
      humOsc.frequency.value = 48 + signal * 58 + lock * 45;

      beatTimer -= dt;
      const interval = THREE.MathUtils.lerp(1.35, 0.15, signal);
      if(signal > 0.13 && beatTimer <= 0){
        heartbeat(signal);
        beatTimer = interval;
      }
    }

    const lockRing = document.getElementById("lockRing");
    lockRing.style.borderColor = "rgba(255,153,0," + (lock*0.72).toFixed(3) + ")";
    lockRing.style.boxShadow = "0 0 " + (18+lock*50).toFixed(0) + "px rgba(255,153,0," + (lock*0.65).toFixed(3) + ")";

    const text = lock > .65 ? "Signal: source lock" :
                 signal < .18 ? "Signal: faint" :
                 signal < .42 ? "Signal: near" :
                 signal < .70 ? "Signal: strong" :
                 "Signal: locked";
    updateHUD(text);

    if(dist < 5.4) foundSource();
  }

  beacons.forEach((b,i)=>{
    const {core,aura,ring,state} = b.userData;
    const pulse = 1 + Math.sin(time*0.006 + i)*0.06;

    b.lookAt(camera.position);

    if(state === "active"){
      core.material.color.set(0xff6600);
      aura.material.color.set(0xff6600);
      ring.material.color.set(0xff9900);

      const auraPulse = 1 + Math.sin(time*0.006)*0.28;
      core.scale.setScalar(1 + Math.sin(time*0.010)*0.13);
      aura.scale.setScalar(1.05 + auraPulse + signal*1.45 + lock*0.55);
      aura.material.opacity = 0.14 + signal*0.28 + lock*0.12;
      ring.scale.setScalar(1.0 + Math.sin(time*0.005)*0.28 + lock*0.32);
      ring.material.opacity = 0.16 + signal*0.24 + lock*0.16;
    }
    else if(state === "complete"){
      core.material.color.set(0x2494ff);
      aura.material.color.set(0x2494ff);
      ring.material.color.set(0x2494ff);

      core.scale.setScalar(1.0);
      aura.scale.setScalar(1.25 + Math.sin(time*0.003 + i)*0.12);
      aura.material.opacity = 0.12;
      ring.scale.setScalar(1.0);
      ring.material.opacity = 0.06;
    }
    else {
      core.material.color.set(0x333333);
      core.scale.setScalar(0.85 * pulse);
      aura.material.opacity = 0.0;
      ring.material.opacity = 0.0;
    }
  });

  renderer.render(scene,camera);
}

animate();

window.addEventListener("resize",()=>{
  camera.aspect = innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
