<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080515"><title>FLASH DANZE — One word. Your move.</title><link rel="stylesheet" href="style.css"></head><body><main class="game" id="game"><div class="stage" aria-hidden="true"><div class="beams"></div><div class="haze"></div><div class="floor"></div><div class="sparks"></div></div><div class="content"><section class="screen" id="home"><div class="homeCenter"><div class="logo hero"><span>FLASH</span><strong>DANZE</strong></div><p class="tag">ONE WORD. YOUR MOVE.</p><button class="bigButton" id="getMoving">GET MOVING <b>→</b></button></div><div class="footnote">NO VOICE. JUST MOVE.</div></section><section class="screen hidden" id="setup"><button class="back" id="back" aria-label="Back">←</button><div class="logo compact"><span>FLASH</span><strong>DANZE</strong></div><p class="tag">ONE WORD. YOUR MOVE.</p><div class="options"><div class="option"><label for="duration">DURATION</label><select id="duration"><option value="30">30 seconds</option><option value="60">1 minute</option><option value="180">3 minutes</option></select></div><div class="option"><label for="pace">CARD PACE</label><select id="pace"><option value="quick">Quick</option><option value="steady" selected>Steady</option><option value="chill">Chill</option></select></div><div class="option"><label for="sound">SOUND EFFECTS</label><select id="sound"><option value="on" selected>On</option><option value="off">Off</option></select></div><div class="option"><label for="language">LANGUAGE</label><select id="language"><option value="en">English</option><option value="es">Español</option></select></div></div><button class="bigButton startButton" id="start">START DANZE <b>→</b></button></section><section class="screen hidden" id="round"><div class="topline"><div class="logo mini"><span>FLASH</span><strong>DANZE</strong></div><span id="remaining">0:30</span></div><div class="centerZone"><div id="command" aria-live="polite">3</div></div><div class="bottomline"><div class="progressTrack"><div id="progress"></div></div><div class="controls"><button id="pause">PAUSE</button><button id="next">NEXT →</button><button id="end">END</button></div></div></section><section class="screen hidden" id="done"><div class="logo compact"><span>FLASH</span><strong>DANZE</strong></div><div class="finishCenter"><h1 id="finishTitle">YOU DID IT!</h1><p>ONE WORD. YOUR MOVE.</p></div><div class="finishButtons"><button class="bigButton" id="again">PLAY AGAIN ↻</button><button class="subButton" id="homeBtn">HOME</button></div></section></div></main><script src="words.js"></script><script src="igusta.js"></script></body></html>
